<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>:root{color-scheme:light}body{margin:0;font-size:14px;background:#f8f8f6}</style></head><body><title>NVDA vs META Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --band:#F5F8F6; --ink:#12201A; --ink2:#3D4C44; --muted:#66756D; --rule:#DAE2DD; --rule2:#C6D1CB;
  --deep:#0A3D2E; --deep2:#0F5A41; --deep0:#062A20; --mint:#A8D0BF;
  --nv:#0A7D55; --mt:#B5820F;
  --bm1:#7B8A82; --bm2:#B7C2BC;
  --up:#0A7D55; --down:#A8432A; --mixed:#6A7871;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:'Public Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;padding-inline:16px;padding-block:20px 64px;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:56px}
.wrap>*{min-width:0}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1,h2{font-family:var(--serif);letter-spacing:-.01em}
h3,h4{font-family:var(--sans)}
p{margin:0}
ul{margin:0}
button{font-family:inherit}
/* glossary ? */
.q{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-left:6px;border:1.5px solid var(--muted);border-radius:50%;background:transparent;color:var(--muted);font:700 10.5px/1 var(--sans);cursor:pointer;vertical-align:1px;padding:0;flex:none;position:relative}
.q:before{content:"";position:absolute;inset:-6px}
.q:hover,.q[aria-expanded="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.mast .q,.dark .q{border-color:rgba(255,255,255,.7);color:#fff}
.mast .q:hover,.mast .q[aria-expanded="true"]{background:#fff;color:var(--deep);border-color:#fff}
.lb{display:inline}
.nw{white-space:nowrap}
#pop{position:fixed;z-index:50;width:min(330px,calc(100vw - 24px));background:#fff;border:1px solid var(--rule2);border-top:3px solid var(--deep);box-shadow:0 10px 30px rgba(6,42,32,.18);padding:14px 16px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
#pop h5{margin:0 0 6px;font:600 14.5px/1.3 var(--sans);color:var(--ink)}
#pop b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--deep2);margin:8px 0 1px}
#pop p+p{margin-top:0}
.eyebrow{font-size:11.5px;line-height:1.5;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* masthead */
.mast{background:linear-gradient(135deg,var(--deep0) 0%,var(--deep) 55%,var(--deep2) 100%);color:#fff;padding:32px 32px 26px;display:flex;flex-direction:column;gap:14px}
.mast h1{font-size:clamp(30px,5vw,46px);line-height:1.08;color:#fff;font-weight:600}
.mast .dek{color:#DCEBE4;font-size:17px;max-width:70ch}
.approach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.approach>div{padding:14px 18px 2px 0;font-size:13.5px;color:#D3E5DC}
.approach>div+div{padding-left:18px;border-left:1px solid rgba(255,255,255,.2)}
.approach b{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mint);margin-bottom:4px}
.approach .ap{display:block;font-weight:600;color:#fff;font-size:15px;margin-bottom:2px}
.asof{font-size:12.5px;color:#A9CDBE}
/* story thread */
.chap{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--deep2);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.chap i{font-style:normal;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:13px}
.smap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--rule);border-top:4px solid var(--deep)}
.smap a{display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.4}
.smap a+a{border-left:1px solid var(--rule)}
.smap a:hover{background:rgba(10,125,85,.06)}
.smap a:focus-visible{outline:2px solid var(--deep);outline-offset:-2px}
.smap b{font:700 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--deep2)}
.smap span{font-weight:600;font-size:14px;line-height:1.3}
.smap em{font-style:normal;color:var(--muted)}
.zoom{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-top:-10px}
@media(max-width:900px){.smap{grid-template-columns:repeat(2,minmax(0,1fr))}.smap a+a{border-left:0}.smap a{border-top:1px solid var(--rule)}.smap a:nth-child(-n+2){border-top:0}.smap a:nth-child(even){border-left:1px solid var(--rule)}}
/* valuation brief */
.vsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-top:4px solid var(--deep)}
.vsteps>div{padding:14px 16px 16px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.vsteps>div+div{border-left:1px solid var(--rule)}
.vsteps b{display:block;font:700 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--deep2);margin-bottom:3px}
.vsteps span{display:block;font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:3px}
.vm{border:1px solid var(--rule);border-top:4px solid var(--c);display:flex;flex-direction:column;background:var(--paper)}
.vm>*{padding:14px 20px}
.vm>*+*{border-top:1px solid var(--rule)}
.vm h3{font-family:var(--serif);font-size:21px;line-height:1.15;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vm h3 small{font:500 13px var(--sans);color:var(--muted)}
.vscen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0!important}
.vscen>div{padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.45}
.vscen>div+div{border-left:1px solid var(--rule)}
.vscen .nm{font:700 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.vscen .fv{font-size:26px;font-weight:600;color:var(--ink);line-height:1.15;margin:3px 0 4px;letter-spacing:-.01em}
.vscen .base{background:var(--band)}
.vscen .base .nm{color:var(--deep2)}
.vfoot{font-size:13px;color:var(--ink2)}
.vact{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.vact a{color:var(--deep2);font-weight:600;font-size:14px}
@media(max-width:900px){.vsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.vsteps>div+div{border-left:0}.vsteps>div{border-top:1px solid var(--rule)}.vsteps>div:nth-child(-n+2){border-top:0}.vsteps>div:nth-child(even){border-left:1px solid var(--rule)}}
@media(max-width:480px){.vscen .fv{font-size:21px}.vscen>div{padding:12px 10px}}
.byline{font-size:13.5px;color:#DCEBE4;font-weight:600;letter-spacing:.01em}
.byline a{color:#fff;text-underline-offset:3px}
.pagefoot{border-top:2px solid var(--deep);padding-top:14px;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.pagefoot b{font-weight:600;color:var(--ink)}
.pagefoot a{color:var(--deep2)}
/* sections */
.sec{display:flex;flex-direction:column;gap:20px}
.hd{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid var(--deep)}
h2{font-size:clamp(23px,3vw,29px);line-height:1.2}
.lead{color:var(--ink2);max-width:76ch;font-size:15.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid2>*{min-width:0}
.panel{border:1px solid var(--rule);padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.panel>h3{font-size:16px;line-height:1.3;display:flex;align-items:center}
.sub{color:var(--muted);font-size:13px}
.k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
/* verdict cards */
.card{border:1px solid var(--rule);border-top:4px solid var(--c);display:grid;grid-template-rows:auto auto auto auto auto auto;gap:0;background:var(--paper)}
.card>*{padding:18px 22px}
.card>*+*{border-top:1px solid var(--rule)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-hd h3{font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:600}
.card-hd .meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tkr{font-weight:700;letter-spacing:.06em;color:var(--ink);font-size:12.5px;border:1px solid var(--rule2);padding:1px 7px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border:1px solid currentColor;line-height:1.2}
.chip svg{width:10px;height:10px;flex:none}
.c-over{color:var(--down)} .c-fair{color:var(--mixed)} .c-under{color:var(--up)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.stats3 .v{font-size:clamp(24px,3.4vw,32px);font-weight:600;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
.v.neg{color:var(--down)} .v.pos{color:var(--up)}
.blk-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600;margin-bottom:10px}
.blk-t .r{font-weight:500;color:var(--muted);font-size:12.5px}
.rng{position:relative;height:90px}
.rng .track{position:absolute;left:0;right:0;top:30px;height:14px;background:var(--band);border:1px solid var(--rule)}
.rng .band{position:absolute;top:30px;height:14px;background:var(--c);opacity:.28}
.rng .mk{position:absolute;top:26px;width:2px;height:22px;background:var(--c);margin-left:-1px}
.rng .mk.base{width:4px;margin-left:-2px;top:24px;height:26px}
.rng .px{position:absolute;top:22px;height:28px;width:0;border-left:2px dashed var(--ink)}
.rng .lbl{position:absolute;transform:translateX(-50%);font-size:12px;line-height:1.25;text-align:center;white-space:nowrap;color:var(--ink2)}
.rng .lbl b{display:block;font-weight:600;color:var(--ink)}
.rng .lbl.top{top:-8px}
.rng .lbl.bot{top:52px}
.rng .lbl.top b{color:var(--ink)}
.w52{position:relative;height:48px}
.w52 .track{position:absolute;left:0;right:0;top:20px;height:8px;background:var(--band);border:1px solid var(--rule)}
.w52 .fill{position:absolute;top:20px;height:8px;background:var(--bm2)}
.w52 .mk{position:absolute;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid var(--ink);top:6px}
.w52 .lo,.w52 .hi{position:absolute;top:32px;font-size:12px;color:var(--muted)}
.w52 .lo{left:0}.w52 .hi{right:0}
.w52 .pl{position:absolute;top:-14px;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap}
.gauge{position:relative;height:56px}
.gauge .zones{position:absolute;left:0;right:0;top:20px;height:12px;display:flex}
.gauge .zones i{display:block;height:100%}
.gauge .zl{position:absolute;top:38px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.gauge .mk{position:absolute;top:12px;width:3px;height:22px;background:var(--ink);margin-left:-1.5px}
.gauge .pl{position:absolute;top:-6px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.mult3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mult3 .v{font-size:20px;font-weight:600;margin-top:2px}
.bottom{border-left:4px solid var(--deep2);background:var(--band);padding:16px 20px;font-size:16px;color:var(--ink)}
.bottom b{font-weight:600}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:12px;align-items:center;font-size:13.5px}
.bar .n{color:var(--ink2);line-height:1.25}
.bar .n small{display:block;color:var(--muted);font-size:11.5px}
.bar .t{position:relative;height:22px;background:var(--band)}
.bar .t i{position:absolute;left:0;top:0;bottom:0}
.bar .t.out i{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.55) 4px 6px)!important;border:1.5px solid var(--cc)}
.bar .t span{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;white-space:nowrap;padding-left:6px}
.bar .t.na span{color:var(--muted);font-weight:500;padding-left:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:var(--band)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--deep)}
.fc{background:#F1F7F4}
th.fc{background:#E4EFE9;color:var(--deep2)}
.mt th{white-space:normal}
.tt td:first-child,.tt th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:150px}
.tt th:first-child{background:var(--band)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.ch h4{font-size:13.5px;font-weight:600;margin-bottom:6px}
svg{display:block;max-width:100%}
svg text{font-family:var(--sans);fill:var(--ink2);font-size:11.5px}
svg .mut{fill:var(--muted)}
svg .st{fill:var(--ink);font-weight:600}
svg .halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
/* meters */
.meter{display:flex;gap:2px;align-items:center}
.meter i{display:block;width:100%;max-width:22px;height:9px;background:var(--rule)}
.meter i.on{background:var(--c)}
.sc{display:flex;align-items:center;gap:10px}
.sc b{font-size:15px;min-width:22px}
.pil td{vertical-align:top}
.pil .ev{color:var(--ink2);font-size:13px;margin-top:5px;max-width:42ch}
/* macro */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--rule)}
.tile{padding:16px 18px}
.tile+.tile{border-left:1px solid var(--rule)}
.tile .v{font-size:26px;font-weight:600;line-height:1.15;margin-top:4px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.rel{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.rel i{display:block;width:9px;height:9px;border-radius:50%;background:var(--rule2)}
.rel i.on{background:var(--deep)}
.mi{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.mi:first-of-type{border-top:0;padding-top:0}
.dir{display:inline-flex;align-items:center;align-self:start;gap:6px;font-size:12.5px;font-weight:600;line-height:1.3;padding-top:2px}
.dir svg{width:11px;height:11px;flex:none}
.d-tail{color:var(--up)} .d-head{color:var(--down)} .d-mix,.d-low{color:var(--mixed)}
.mi h4{font-size:14.5px;display:flex;align-items:center;flex-wrap:wrap}
.mi .rd{font-weight:600;font-size:14px;margin-top:2px}
.mi .pd{color:var(--muted);font-size:12.5px}
.mi .wy{color:var(--ink2);font-size:13.5px;margin-top:3px}
.net{background:var(--band);padding:10px 14px;font-size:14px;font-weight:600;border-left:4px solid var(--c)}
/* heat */
.heat td,.heat th{text-align:center;padding:9px 4px;font-size:13.5px}
.heat th.rh{text-align:right;white-space:nowrap;padding-right:10px}
.heat td.hit{font-weight:700;color:var(--deep)}
.heat td.bc{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}
.axis{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:2px}
/* pre-mortem */
.pm .it{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.pm .it:first-of-type{border-top:0;padding-top:0}
.sev{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.sev.High{color:var(--down)} .sev.Medium{color:#8A6100}
.pm h4{font-size:15px;margin-bottom:2px}
.pm .w{font-size:13.5px;color:var(--ink2)}
.pm .w b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:6px}
.ignore{padding:12px 14px;background:var(--band);border-left:4px solid var(--deep2);font-size:13.5px}
.ignore b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.lens ul{padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink2);font-size:14.5px}
/* segments */
.stack{display:flex;height:30px;border:1px solid var(--rule)}
.stack div{display:flex;align-items:center;padding-inline:8px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.pbar{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:12px;align-items:center;font-size:13.5px}
.pb{position:relative;height:24px;background:var(--band)}
.pb i{position:absolute;top:0;bottom:0}
.pb .z{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.pb span{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:600;white-space:nowrap}
.insight{border-top:1px solid var(--rule);padding-top:12px;color:var(--ink2);font-size:14.5px}
.insight b{color:var(--ink)}
/* download */
.dlbox{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;background:var(--band);border:1px solid var(--rule);border-top:4px solid var(--deep);padding:24px}
.dlbox ul{padding-left:18px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:5px;margin-top:8px}
.btn{appearance:none;border:0;background:var(--deep);color:#fff;font:600 14.5px var(--sans);padding:13px 22px;cursor:pointer;width:fit-content}
.btn:hover{background:var(--deep2)}
.btn[disabled]{background:var(--bm2);cursor:not-allowed}
.foot{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:10px;max-width:84ch}
.foot a{color:var(--deep2)}
.disc{border-top:2px solid var(--deep);padding-top:12px;font-size:13.5px;color:var(--ink2);max-width:84ch}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--deep0);color:#fff;font-size:12.5px;line-height:1.5;padding:7px 10px;max-width:260px;white-space:pre-line}
:focus-visible{outline:2px solid var(--deep2);outline-offset:2px}
@media (max-width:980px){
  .approach{grid-template-columns:repeat(2,minmax(0,1fr))}
  .approach>div:nth-child(3){padding-left:0;border-left:0}
  .approach>div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.2);margin-top:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3){border-left:0}
  .tile:nth-child(n+3){border-top:1px solid var(--rule)}
  .dlbox{grid-template-columns:1fr}
}
@media (max-width:820px){

uch pricing power and loyalty the company has.", "h": "Scored 1–10 from evidence such as gross margin, customer concentration, user engagement and price trends."}, "growth": {"t": "Growth Engine", "d": "How fast revenue is growing and how durable the drivers are.", "h": "Scored 1–10 from recent growth, company guidance and the strength of the drivers behind it."}, "profitq": {"t": "Profit Quality", "d": "How much of each sales dollar becomes operating profit and cash, and how well capital is used.", "h": "Scored 1–10 from operating margin, return on capital and free cash flow."}, "balance": {"t": "Balance-Sheet Strength", "d": "Whether the company can fund itself: cash against debt, and cash generated after investment.", "h": "Scored 1–10 from net cash or debt, free cash flow after capital spending, and shareholder returns."}, "valgap": {"t": "Valuation Gap", "d": "How far today's price sits from our Base fair value.", "h": "Score = 6 + 10 × margin of safety, rounded and held between 1 and 10. A score of 6 means fairly priced; below 6 means the price is above Base."}, "dcf": {"t": "Discounted cash flow (DCF)", "d": "A way to value a business as the cash it will generate in future, converted into today's money.", "h": "Forecast 10 years of free cash flow, discount each at the cost of capital, add a terminal value, add cash, subtract debt, divide by shares."}, "fcff": {"t": "Free cash flow to the firm (FCFF)", "d": "Cash the business generates after tax and reinvestment, before paying lenders or owners.", "h": "Revenue × operating margin × (1 − tax rate) × cash conversion."}, "cashconv": {"t": "Cash conversion", "d": "The share of after-tax operating profit that turns into free cash after reinvestment.", "h": "FCFF ÷ after-tax operating profit. Lower means more cash is being reinvested in capacity."}, "wacc": {"t": "Cost of capital (WACC)", "d": "The return investors demand for funding the company. It is the rate used to discount future cash.", "h": "Equity share × cost of equity + debt share × after-tax cost of debt. We hold it between 8% and 11%."}, "coe": {"t": "Cost of equity", "d": "The return shareholders require.", "h": "Risk-free rate + adjusted beta × equity risk premium."}, "beta": {"t": "Beta", "d": "How much the stock tends to move compared with the market. Above 1 means bigger swings.", "h": "Five-year measure from a data provider, then adjusted: 0.67 × raw beta + 0.33 (the Blume adjustment)."}, "rf": {"t": "Risk-free rate", "d": "The return on a safe government bond. It is the starting point for all required returns.", "h": "We use the 10-year US Treasury yield: 4.94% on 17 Sep 2026."}, "erp": {"t": "Equity risk premium", "d": "The extra return investors demand from stocks over safe bonds.", "h": "An analyst assumption: 4.5%."}, "tg": {"t": "Terminal growth", "d": "The steady growth rate assumed forever after year 10.", "h": "Set at 3.0%, at or below the risk-free rate so the company never outgrows the economy."}, "tv": {"t": "Terminal value", "d": "The value of all cash flows beyond year 10.", "h": "Year-10 FCFF × (1 + g) ÷ (WACC − g), then discounted back to today."}, "fair": {"t": "Fair value per share", "d": "What one share is worth if a given scenario plays out.", "h": "(Present value of cash flows + cash − debt) ÷ shares outstanding."}, "scen": {"t": "Bear, Base and Bull scenarios", "d": "Three versions of the company's future: cautious, central and optimistic.", "h": "Each scenario sets year-1 revenue, growth for years 2–5, operating margin and cash conversion. Base is our central case."}, "gap": {"t": "Gap to price (margin of safety)", "d": "How far Base fair value is from the market price. Negative means the price is above Base.", "h": "Base fair value ÷ share price − 1."}, "reverse": {"t": "Reverse DCF", "d": "Works backwards from the price to find the growth the market is already assuming.", "h": "Scales the Base growth rates for years 2–5 until the DCF value equals today's price."}, "cagr": {"t": "Revenue growth per year (CAGR)", "d": "The steady annual growth rate that turns starting revenue into ending revenue.", "h": "(Ending revenue ÷ starting revenue)^(1 ÷ years) − 1. Here: latest twelve months to year 5."}, "range52": {"t": "52-week range", "d": "The lowest and highest trading prices over the last year.", "h": "Taken from market data. The marker shows where today's price sits within it."}, "mcap": {"t": "Market capitalisation", "d": "The market value of all shares.", "h": "Share price × shares outstanding."}, "pe_t": {"t": "Trailing P/E", "d": "Price paid per dollar of the last twelve months' earnings.", "h": "Share price ÷ diluted earnings per share, last twelve months."}, "pe_f": {"t": "Forward P/E", "d": "Price paid per dollar of expected earnings.", "h": "Share price ÷ analysts' consensus earnings per share for the next period."}, "peg": {"t": "PEG ratio", "d": "P/E adjusted for growth. Below 1 suggests the price is low relative to expected growth.", "h": "Forward P/E ÷ expected annual earnings growth (%)."}, "evebitda": {"t": "EV/EBITDA", "d": "What the whole business (equity plus net debt) costs per dollar of operating cash earnings.", "h": "Enterprise value ÷ earnings before interest, tax, depreciation and amortisation."}, "bench": {"t": "Benchmarks", "d": "Reference points for judging a P/E: the S&P 500 (the broad market) and the company's industry.", "h": "S&P 500: FactSet. Industry: fund-level P/E from the iShares Semiconductor ETF and the Communication Services Select Sector SPDR. Methods differ, so treat them as guides."}, "impliedpe": {"t": "P/E implied by our Base value", "d": "The P/E you would pay at our Base fair value instead of today's price.", "h": "Base fair value ÷ consensus forward EPS."}, "gm": {"t": "Gross margin", "d": "Share of revenue left after the direct cost of delivering the product.", "h": "(Revenue − cost of revenue) ÷ revenue."}, "om": {"t": "Operating margin", "d": "Share of revenue left as profit after all operating costs ator drives this company's results.", "h": "High: moves revenue or valuation directly. Med: works through costs or customers. Low: minor link."}, "taxrate": {"t": "Tax rate", "d": "The rate applied to operating profit in the model.", "h": "15% blended assumption, applied to all years."}, "pillar": {"t": "Pillar score", "d": "A 1–10 score for one part of the BBS framework.", "h": "Analyst judgement from the evidence listed beside it, except Valuation Gap, which is formula-driven."}, "method": {"t": "Story to numbers to value", "d": "The order of the analysis: write the business story, turn it into explicit forecasts, then value it.", "h": "This follows the approach taught by Aswath Damodaran."}, "asof": {"t": "As-of date", "d": "Prices are closing prices on 18 Sep 2026. Company data comes from the latest earnings releases.", "h": "Macro readings carry their own dates."}}, "sources": [["NVIDIA statistics, StockAnalysis", "https://stockanalysis.com/stocks/nvda/statistics/"], ["Meta statistics, StockAnalysis", "https://stockanalysis.com/stocks/meta/statistics/"], ["NVIDIA earnings releases", "https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-fourth-quarter-and-fiscal-2026"], ["Meta earnings releases", "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Fourth-Quarter-and-Full-Year-2025-Results/default.aspx"], ["NVIDIA Q2 FY2027", "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx"], ["Meta Q2 2026", "https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx"], ["FactSet Earnings Insight", "https://advantage.factset.com/hubfs/Website/Resources%20Section/Research%20Desk/Earnings%20Insight/EarningsInsight_091826.pdf"], ["iShares SOXX", "https://www.ishares.com/us/products/239705/ishares-phlx-semiconductor-etf"], ["SPDR XLC", "https://www.ssga.com/us/en/intermediary/et const G = D.gloss;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const q = k => G[k] ? `<button class="q" type="button" data-k="${k}" aria-label="What is ${esc(G[k].t)}?" aria-expanded="false">?</button>` : "";
const L = (t, k) => { const i = t.lastIndexOf(" "); return i < 0 ? `<span class="lb"><span class="nw">${t}${q(k)}</span></span>` : `<span class="lb">${t.slice(0, i)} <span class="nw">${t.slice(i + 1)}${q(k)}</span></span>`; };
const usd = (v, d = 2) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const usd0 = v => usd(v, 0);
const pct = (v, d = 0, sign = false) => (v < 0 ? "−" : (sign && v > 0 ? "+" : "")) + Math.abs(v * 100).toFixed(d) + "%";
const x1 = v => (Math.round(v * 10 + 1e-9) / 10).toFixed(1) + "x";
const bn = v => "$" + (v >= 100 ? Math.round(v).toLocaleString("en-US") : v.toFixed(1)) + "B";
const band = s => s >= 80 ? "Exceptional" : s >= 65 ? "Strong" : s >= 50 ? "Mixed" : "Weak";
const S = D.s, ORDER = D.order;
const arrowUp = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9 9H1z" fill="currentColor"/></svg>`;
const arrowDn = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 9 1 1h8z" fill="currentColor"/></svg>`;
const diamond = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.5 9.5 5 5 9.5 0.5 5z" fill="currentColor"/></svg>`;
const ring = `<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;

/* ---------- popover ---------- */
const pop = $("#pop");
let popBtn = null;
function closePop(refocus) {
  if (!popBtn) return;
  popBtn.setAttribute("aria-expanded", "false");
  if (refocus) popBtn.focus();
  popBtn = null; pop.hidden = true;
}
function openPop(btn) {
  const g = G[btn.dataset.k]; if (!g) return;
  if (popBtn) popBtn.setAttribute("aria-expanded", "false");
  popBtn = btn; btn.setAttribute("aria-expanded", "true");
  pop.innerHTML = `<h5>${esc(g.t)}</h5><b>What it is</b><p>${esc(g.d)}</p><b>How it is calculated</b><p>${esc(g.h)}</p>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(Math.max(r.left + r.width / 2 - w / 2, 12), innerWidth - w - 12);
  let top = r.bottom + 10;
  if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 10);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
document.addEventListener("click", e => {
  const b = e.target.closest(".q");
  if (b) { e.preventDefault(); popBtn === b ? closePop() : openPop(b); return; }
  if (!e.target.closest("#pop")) closePop();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(true); });
addEventListener("scroll", () => closePop(), { passive: true });
addEventListener("resize", () => closePop());

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(html, x, y) {
  tip.textContent = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(x + 14, 8), innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, y - h - 12) + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ---------- builders ---------- */
const pctPos = (v, max) => Math.max(0, Math.min(100, v / max * 100));
const clampLbl = p => Math.max(9, Math.min(91, p));

function rangeChart(s) {
  const c = s.color, max = s.axisMax;
  const p = v => pctPos(v, max);
  const { Bear, Base, Bull } = s.fv;
  const lbl = (v, t, cls) => `<div class="lbl ${cls}" style="left:${clampLbl(p(v))}%"><b>${t}</b>${usd0(v)}</div>`;
  return `<div class="rng" style="--c:${c}" role="img" aria-label="${s.name} fair value range from ${usd0(Bear)} to ${usd0(Bull)}, Base ${usd0(Base)}, price ${usd(s.price)}">
    <div class="track"></div>
    <div class="band" style="left:${p(Bear)}%;width:${p(Bull) - p(Bear)}%"></div>
    <div class="mk" style="left:${p(Bear)}%"></div><div class="mk base" style="left:${p(Base)}%"></div><div class="mk" style="left:${p(Bull)}%"></div>
    <div class="px" style="left:${p(s.price)}%"></div>
    <div class="lbl top" style="left:${clampLbl(p(s.price))}%"><b>Price</b>${usd0(s.price)}</div>
    ${lbl(Bear, "Bear", "bot")}${lbl(Base, "Base", "bot")}${lbl(Bull, "Bull", "bot")}
  </div>`;
}
function w52(s) {
  const p = v => pctPos(v - s.low, s.high - s.low);
  return `<div class="w52" role="img" aria-label="52-week range ${usd(s.low)} to ${usd(s.high)}, price ${usd(s.price)}">
    <div class="track"></div><div class="fill" style="left:0;width:${p(s.price)}%;background:var(--c);opacity:.3"></div>
    <div class="pl" style="left:${clampLbl(p(s.price))}%">${usd(s.price)}</div>
    <div class="mk" style="left:${p(s.price)}%"></div>
    <div class="lo">Low ${usd(s.low)}</div><div class="hi">High ${usd(s.high)}</div></div>`;
}
function gauge(score) {
  const zones = [[0, 50, "#E4EFE9", "Weak"], [50, 65, "#B9D8C9", "Mixed"], [65, 80, "#5FAE8C", "Strong"], [80, 100, "#0A7D55", "Exceptional"]];
  return `<div class="gauge" role="img" aria-label="BBS score ${score} of 100, ${band(score)}">
    <div class="zones">${zones.map(z => `<i style="width:${z[1] - z[0]}%;background:${z[2]}"></i>`).join("")}</div>

/* ---------- financial charts (width-aware SVG) ---------- */
const niceMax = v => { const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; };
function revChart(el, k) {
  const s = S[k], f = s.fin, W = Math.max(280, el.clientWidth), H = 240, m = { l: 48, r: 8, t: 26, b: 30 };
  const lab = [...f.hist.short, ...f.fwd.short], val = [...f.hist.rev, ...f.fwd.rev], n = val.length, nh = f.hist.rev.length;
  const mx = niceMax(Math.max(...val) * 1.02), iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / n;
  const y = v => m.t + ih - v / mx * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = mx * i / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAE6"/><text class="mut" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? "$0" : v >= 1000 ? "$" + (v / 1000) + "T" : "$" + v + "B"}</text>`; }
  const step = W < 520 ? 2 : 1; let bars = "", xl = "", tips = "";
  val.forEach((v, i) => {
    const x = m.l + i * bw + bw * .16, w = bw * .68, fc = i >= nh;
    bars += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, y(0) - y(v))}" fill="${s.color}" ${fc ? `fill-opacity=".28" stroke="${s.color}" stroke-dasharray="3 2"` : ""}/>`;
    if (i % step === 0 || i === n - 1) xl += `<text class="mut" x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${lab[i]}</text>`;
    tips += `<rect data-i="${i}" x="${m.l + i * bw}" y="${m.t}" width="${bw}" height="${ih + m.b}" fill="transparent"/>`;
  });
  const lastH = nh - 1, dx = m.l + nh * bw;
  const lv = (i, txt, an = "middle") => `<text class="st halo" x="${m.l + i * bw + bw / 2 + (an === "end" ? bw * .3 : 0)}" y="${y(val[i]) - 6}" text-anchor="${an}">${txt}</text>`;
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name} revenue history and Base forecast in billions of dollars">
    ${g}${bars}<line x1="${dx}" x2="${dx}" y1="${m.t - 6}" y2="${y(0)}" stroke="#66756D" stroke-dasharray="4 3"/>
    <text class="mut" x="${dx - 6}" y="${m.t - 10}" text-anchor="end">Actual</text><text class="mut" x="${dx + 6}" y="${m.t - 10}">Base forecast</text>
    ${lv(lastH, bn(val[lastH]), "end")}${lv(n - 1, bn(val[n - 1]), "end")}${xl}${tips}</svg>`;
  el.innerHTML = svg;
  el.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener("pointermove", e => showTip(`${(i < nh ? f.hist.labels[i] : f.fwd.labels[i - nh] + " (Base forecast)")}\nRevenue ${bn(val[i])}${i > 0 ? "\nGrowth " + pct(i < nh ? f.hist.g[i] : f.fwd.g[i - nh], 0, true) : ""}`, e.clientX, e.clientY));
    r.addEventListener("pointerleave", hideTip);
  });
}
function marginChart(el, k) {

  let g = ""; for (let i = 0; i <= 4; i++) { const v = i / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAE6"/><text class="mut" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`; }

  el.querySelectorAll("rect[data-i]").forEach(r => {

    r.addEventListener("pointerleave", hideTip);

    const s = S[k], mc = s.macro;
    return `<div class="panel" style="--c:${s.color}"><h3><span class="dot" style="background:${s.color}"></span>${s.name}: selected indicators</h3><div class="net">Net read: ${mc.net}</div><div>
      ${mc.items.map(it => `<div class="mi"><div class="dir d-${it.d}">${dirIco[it.d]}${dirTxt[it.d]}</div><div><h4>${L(it.n, it.k)}</h4><div class="rd">${it.r}</div><div class="pd">${it.p} · <a href="${it.url}" style="color:var(--deep2)">source</a></div><div class="wy">${it.why}</div></div></div>`).join("")}</div></div>`;
  }).join("");
  return `<section class="sec" id="macro"><div class="hd"><h2>Macro backdrop, chosen for each company</h2><p class="lead">The wider economy reaches each company through a different channel. The readings below are the latest published figures, tagged as a tailwind, headwind or mixed for the company they affect. ${L("How to read the tags", "dir")}</p></div>
    <div class="tiles">${tiles}</div>${matrix}<div class="grid2">${panels}</div></section>`;
}

function pillarSection() {
  const P = [["Brand Power", "brand"], ["Growth Engine", "growth"], ["Profit Quality", "profitq"], ["Balance-Sheet Strength", "balance"], ["Valuation Gap", "valgap"]];
  const meter = (v, c) => `<div class="sc"><div class="meter" style="--c:${c};width:min(230px,100%)">${[...Array(10)].map((_, i) => `<i class="${i < v ? "on" : ""}"></i>`).join("")}</div><b>${v}</b></div>`;
  const rows = P.map((p, i) => `<tr><td style="white-space:nowrap"><b>${L(p[0], p[1])}</b></td>${ORDER.map(k => `<td>${meter(S[k].bbs[i], S[k].color)}<div class="ev">${S[k].ev[i]}</div></td>`).join("")}</tr>`).join("");
  const tot = `<tr class="tot"><td>${L("BBS Score", "bbs")}<div class="sub" style="font-weight:400">Sum of pillars × 2</div></td>${ORDER.map(k => `<td>${S[k].bbsTotal} of 100 · ${band(S[k].bbsTotal)}</td>`).join("")}</tr>`;
  return `<section class="sec" id="score"><div class="hd"><h2>The BBS Score, pillar by pillar</h2><p class="lead">Five pillars scored 1–10 and doubled to a score out of 100. Four are analyst judgements from the evidence beside them; ${L("Valuation Gap", "valgap")} is calculated from the model.</p></div>
    <div class="panel"><div class="tw"><table class="pil"><thead><tr><th>Pillar</th>${ORDER.map(k => `<th><span class="dot" style="background:${S[k].color}"></span>${S[k].name}</th>`).join("")}</tr></thead><tbody>${rows}${tot}</tbody></table></div></div></section>`;
}
function lensSection() {
  return `<section class="sec" id="lens"><div class="hd"><h2>The marketing lens</h2><p class="lead">How well does each company turn brand and reach into pricing power? This is where a marketing view adds something a spreadsheet misses.</p></div>
    <div class="grid2 lens">${ORDER.map(k => `<div class="panel"><h3><span class="dot" style="background:${S[k].color}"></span>${S[k].name}</h3><ul>${S[k].lens.map(t => `<li>${t}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
}
function sensSection() {
  const t = ORDER.map(k => {
    const s = S[k], sn = s.sens, price = s.price;
    const bcI = 2, bcJ = 2;
    const cell = (v, i, j) => {
      const r = v / price, a = Math.max(0, Math.min(1, (r - .4) / .8)) * .5;
      const cls = (v >= price ? "hit " : "") + (i === bcI && j === bcJ ? "bc" : "");
      return `<td class="${cls.trim()}" style="background:rgba(10,125,85,${a.toFixed(2)})">${usd0(v)}</td>`;
    };
    return `<div class="panel"><h3><span class="dot" style="background:${s.color}"></span>${s.name}: Base fair value per share (price ${usd(price)})</h3>
      <div class="axis"><span>Rows: ${L("discount rate", "wacc")}</span><span>Columns: ${L("terminal growth", "tg")}</span></div><div class="tw"><table class="heat"><thead><tr><th class="rh"></th>${sn.tgs.map(g => `<th>${pct(g, 1)}</th>`).join("")}</tr></thead><tbody>
      ${sn.waccs.map((w, i) => `<tr><th class="rh">${pct(w, 2)}</th>${sn.grid[i].map((v, j) => cell(v, i, j)).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="note">${s.sensNote} Bold cells reach today's price; the outlined cell is our Base. Darker green means a higher value.</p></div>`;
  }).join("");
  return `<section class="sec" id="sens"><div class="hd"><h2>How fragile is the answer?</h2><p class="lead">Base fair value if the two most influential assumptions move: the return investors demand (rows) and long-run growth (columns). ${L("How to read a sensitivity table", "sens")}</p></div><div class="grid2">${t}</div></section>`;
}
function pmSection() {
  const t = ORDER.map(k => {
    const s = S[k];
    return `<div class="panel pm"><h3><span class="dot" style="background:${s.color}"></span>${s.name}: down 40% in three years, because…</h3><div>
      ${s.pm.map(p => `<div class="it"><div class="sev ${p[0]}">${p[0]}</div><div><h4>${p[1]}</h4><div class="w"><b>Watch</b>${p[2]}</div><div class="w"><b>Rethink if</b>${p[3]}</div></div></div>`).join("")}</div>
      <div class="ignore"><b>The bear case we would least want to ignore</b>${s.ignore}</div></div>`;
  }).join("");
  return `<section class="sec" id="premortem"><div class="hd"><h2>Pre-mortem: how each thesis fails</h2><p class="lead">A ${L("pre-mortem", "premortem")} assumes it is three years from now and the share price is down 40%, then asks why. These are the most likely reasons, the signal to watch and a suggested trigger for rethinking. Triggers are our suggestions, not company disclosures.</p></div><div class="grid2">${t}</div></section>`;
}
function downloadSection() {
  return `<section class="sec" id="model"><div class="hd"><h2>Download the valuation model</h2></div><div class="dlbox"><div style="display:flex;flex-direction:column;gap:12px">
    <p>Every number on this page comes from a live Excel workbook. Change a blue input and the value per share, verdict and BBS Score recalculate.</p>
    <button class="btn" id="dl" type="button">Download Excel model (.xlsx)</button>
    <p class="note" id="dlmsg">Google Sheets: upload the file to Google Drive, then open it with Google Sheets. All formulas recalculate.</p></div>
    <div><div class="lab">Inside the workbook</div><ul>
      <li><b>Summary</b>: both companies side by side, with multiples</li>
      <li><b>NVDA</b> and <b>META</b>: cost of capital, scenarios, ten-year cash flows, valuation bridge, sensitivity</li>
      <li><b>NVDA_PnL</b> and <b>META_PnL</b>: full income statement, ten years of history and five forecast periods</li>
      <li><b>PE_Benchmarks</b>: P/E against the S&amp;P 500 and industry, and the P/E implied by our Base value</li>
      <li><b>Macro</b>: indicators chosen for each company, with sources</li>
      <li><b>BBS_Score</b>: pillar scores and adjustable weights</li></ul></div></div></section>`;
}
function methodSection() {
  const rows = ORDER.flatMap(k => Object.entries(S[k].as).map(([n, a]) => `<tr><td>${S[k].name}</td><td>${n}</td><td class="n">${usd0(a.r1)}B</td><td class="n">${a.g}</td><td class="n">${a.m}</td><td class="n">${a.f}</td><td class="n">${usd0(S[k].fv[n])}</td></tr>`)).join("");
  return `<section class="sec" id="method"><div class="hd"><h2>Method, assumptions and sources</h2></div>
    <div class="panel"><div class="tw"><table class="mt"><thead><tr><th>Company</th><th>Scenario</th><th class="n">Year-1 revenue</th><th class="n">Growth, years 2–5</th><th class="n">${L("Operating margin", "om")}, year 1 → 5</th><th class="n">${L("Cash conversion", "cashconv")}, year 1 → 5</th><th class="n">Fair value</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="foot">
      <p><b>How we value.</b> Ten-year discounted cash flow: five explicit years, then growth fades in a straight line to ${pct(D.terminal, 1)} long-run growth. Free cash flow = revenue × operating margin × (1 − ${pct(D.tax, 0)} tax) × cash conversion. The discount rate is the ${pct(D.rf, 2)} risk-free rate (10-year Treasury, 17 Sep 2026) plus a ${pct(D.erp, 1)} equity premium times a Blume-adjusted beta, blended with an assumed ${pct(D.kd, 2)} cost of debt and then held between 8% and 11%. Nvidia's calculated ${pct(S.NVDA.waccCalc, 1)} is capped at 11%; Meta's ${pct(S.META.waccCalc, 1)} is used as is. The equity premium and cost of debt are our own assumptions.</p>
      <p><b>What changed from the previous version.</b> The risk-free rate moved from an illustrative 4.2% to the actual 4.94% Treasury yield, which lowered Meta's Base value from $518 to ${usd0(S.META.fv.Base)}. Nvidia's Base value is unchanged because its discount rate was already at the 11% cap.</p>
      <p><b>Where our Base sits versus the Street.</b> Year-1 revenue is anchored to company guidance (Nvidia's Q3 outlook of $108B, Meta's $61–64B). The consensus figures in the P/E section imply higher earnings than our year-1 Base, so if you trust the Street more than we do, read the Bull column.</p>
      <p><b>Data quality.</b> Company multiples and market data come from one aggregator each; results were read from company releases through an automated fetch and cross-checked for internal consistency (operating income and net income reconcile in every year) but not against a second source. Nvidia's release, as retrieved, splits revenue only into Data Center and "Edge computing" and gives no segment profit. Forecasts are estimates, and macro tags are our judgement.</p>
      <p><b>Sources.</b> ${D.sources.map(x => `<a href="${x[1]}">${x[0]}</a>`).join(" · ")}</p></div>
    <p class="disc"><b>Education only.</b> This is analysis under stated assumptions, not personalised investment advice and not a recommendation to buy, sell or hold anything. The author is not a licensed advisor. Past performance and forecasts do not predict future returns.</p></section>`;
}

/* ---------- page ---------- */
function mast() {
  const N = S.NVDA, M = S.META;
  return `<header class="mast"><div class="eyebrow"><span class="lb">Brand-to-Balance-Sheet (BBS) Scorecard${q("bbs")}</span></div>
    <h1>Nvidia and Meta: both priced above our Base case</h1>
    <p class="dek">Nvidia scores ${N.bbsTotal} and Meta ${M.bbsTotal} on the BBS. At today's prices, both assume more growth than our central forecast, Nvidia by more.</p>
    <div class="byline">Brand-to-Balance-Sheet (BBS) method by Jay Nair · <a href="https://github.com/jay-nair-builds/foundry">github.com/jay-nair-builds/foundry</a></div>
    <div class="approach">
      <div><b>${L("Method", "method")}</b><span class="ap">Story, numbers, value</span>Ten-year discounted cash flow in the Damodaran tradition</div>
      <div><b>${L("Scenarios", "scen")}</b><span class="ap">Bear, Base, Bull</span>Plus a reverse DCF of what the price assumes</div>
      <div><b>${L("Discount rate", "wacc")}</b><span class="ap">${pct(N.wacc, 1)} Nvidia · ${pct(M.wacc, 1)} Meta</span>Built on a ${pct(D.rf, 2)} risk-free rate</div>
      <div><b>${L("Score", "bbs")}</b><span class="ap">BBS, 0 to 100</span>Five pillars from brand to balance sheet</div>
    </div>
    <div class="asof">Prices at close ${D.asof} · Education only, not investment advice</div></header>`;
}
function glance() {
  return `<section class="sec" id="glance"><div class="hd"><h2>Verdict at a glance</h2></div>
    <div class="grid2">${ORDER.map(card).join("")}</div><p class="bottom">${D.bottom}</p></section>`;
}
const CH = [
  ["brand", "The brand", "Why do customers choose these companies?"],
  ["business", "The business", "Where does the money actually come from?"],
  ["record", "The track record", "Has the business delivered?"],
  ["world", "The economy around it", "What is the outside world doing to it?"],
  ["strength", "The score", "Put together, how strong is each business?"],
  ["price", "The price", "What is already priced in, and is it cheap?"],
  ["risk", "What could break it", "What would make our answer wrong?"],
];
function chap(i, html, cont) {
  const c = CH[i];
  const tag = `<div class="chap">${cont ? "Chapter " + (i + 1) + " continued" : "Chapter " + (i + 1) + " of " + CH.length}<span>· ${c[1]}</span><i>${cont ? "" : c[2]}</i></div>`;
  return html.replace('<div class="hd">', '<div class="hd">' + tag);
}
function storyMap() {
  return `<section class="sec" id="story"><div class="hd"><h2>The story behind the verdict</h2><p class="lead">The page follows the Brand-to-Balance-Sheet idea: start with why customers choose the company, follow the money through the business and its record, look at the economy around it, then ask what the price assumes and what could break the answer. Each chapter answers one question.</p></div>
    <nav class="smap" aria-label="Chapters">${CH.map((c, i) => `<a href="#ch-${c[0]}"><b>Chapter ${i + 1}</b><span>${c[1]}</span><em>${c[2]}</em></a>`).join("")}</nav></section>`;
}
function anchored(id, html) { return html.replace('<section class="sec"', `<section class="sec" id="ch-${id}"`).replace(/ id="[a-z]+">/, ">"); }
function valBrief() {
  const steps = [["Step 1", "Forecast", "Five years of revenue and operating margin, in three scenarios."],
    ["Step 2", "Turn profit into cash", "Take off tax, then the cash the business must reinvest to grow."],
    ["Step 3", "Discount to today", "Future cash is worth less today. We discount it at the return investors demand and fade growth to " + pct(D.terminal, 0) + " a year."],
    ["Step 4", "Value per share", "Add cash, subtract debt, divide by shares. Compare with the price."]];
  const cards = ORDER.map(k => {
    const s = S[k], a = s.as;
    const col = n => `<div class="${n === "Base" ? "base" : ""}"><div class="nm">${n}</div><div class="fv">${usd0(s.fv[n])}</div>Year-1 revenue ${usd0(a[n].r1)}B<br>Margin ${a[n].m}<br>Growth ${a[n].g.split(",")[0]} in year 2</div>`;
    return `<div class="vm" style="--c:${s.color}"><h3><span><span class="dot" style="background:${s.color}"></span>${s.name}</span><small>Price ${usd(s.price)}</small></h3>
      <div class="vscen">${["Bear", "Base", "Bull"].map(col).join("")}</div>
      <div class="vfoot">Discount rate <b>${pct(s.wacc, 1)}</b> ${q("wacc")} · long-run growth <b>${pct(D.terminal, 1)}</b> · Base is <b>${pct(Math.abs(s.mos), 0)} ${s.mos < 0 ? "below" : "above"}</b> the price</div></div>`;
  }).join("");
  return `<section class="sec" id="valbrief"><div class="hd"><h2>The valuation model in brief</h2><p class="lead">The verdict above comes from a ${L("discounted cash flow", "dcf")}: what the business's future cash is worth in today's money. Three scenarios show the range; Base is our central case.</p></div>
    <div class="vsteps">${steps.map(t => `<div><b>${t[0]}</b><span>${t[1]}</span>${t[2]}</div>`).join("")}</div>
    <div class="grid2">${cards}</div>
    <div class="vact"><button class="btn" type="button" data-dl>Download the Excel model</button><a href="#method">Full assumptions and method</a><a href="#ch-price">What the price assumes</a><a href="#ch-risk">How fragile the answer is</a></div></section>`;
}
function pageFoot() {
  return `<footer class="pagefoot"><span><b>Brand-to-Balance-Sheet (BBS) method by Jay Nair</b> · <a href="https://github.com/jay-nair-builds/foundry">github.com/jay-nair-builds/foundry</a></span><span>Licensed under Apache-2.0 · Education only, not investment advice</span></footer>`;
}
function render() {
  const secs = [
    mast(), glance(), valBrief(), storyMap(),
    anchored("brand", chap(0, lensSection())),
    anchored("business", chap(1, segSection())),
    anchored("record", chap(2, finSection())),
    anchored("world", chap(3, macroSection())),
    anchored("strength", chap(4, pillarSection())),
    anchored("price", chap(5, pricedSection())),
    chap(5, peSection(), true),
    anchored("risk", chap(6, sensSection())),
    chap(6, pmSection(), true),
    downloadSection(), methodSection(), pageFoot(),
  ];
  $("#app").innerHTML = secs.join("");
  drawCharts();
}
function drawCharts() { ORDER.forEach(k => { const a = $("#rc-" + k), b = $("#mc-" + k); if (a) revChart(a, k); if (b) marginChart(b, k); }); }
render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });

/* ---------- download ---------- */
(async () => {
  const btns = [...document.querySelectorAll("[data-dl], #dl")], msg = $("#dlmsg"); let dl = null;
  try { dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (!dl) { btns.forEach(b => { b.disabled = true; b.textContent = "Download available in the published view"; }); msg.textContent = "Downloads work from the published page. Google Sheets: upload the .xlsx to Google Drive and open it with Google Sheets."; return; }
  btns.forEach(btn => btn.addEventListener("click", async () => {
    try {
      const bin = atob(XLSX_B64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const blob = new Blob([u8], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      await dl.save({ filename: "BBS_Valuation_Model_NVDA_META.xlsx", data: blob });
      msg.textContent = "Saved. Open it in Excel, or upload it to Google Drive to use Google Sheets.";
    } catch (e) { msg.textContent = "The download was cancelled or blocked. Try again."; }
  }));
})();

</script>
</body></html>
