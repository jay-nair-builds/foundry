name: Add an investor to Protégé
description: Request a new investor. It is checked against SEC filings and added automatically.
title: "Add investor: "
labels: ["add-investor"]
body:
  - type: markdown
    attributes:
      value: |
        Any fund or family office that files a **Form 13F** with the SEC can be added. An automation looks it up, adds it and rebuilds the site, usually within a few minutes.
  - type: input
    id: fund
    attributes:
      label: Fund name or CIK
      description: The legal name as filed with the SEC (for example "Pershing Square Capital Management, L.P.") or its numeric CIK.
      placeholder: Pershing Square Capital Management, L.P.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: Who runs it, or why it is worth following.
