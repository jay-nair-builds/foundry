name: Refresh 13F data

on:
  workflow_dispatch:
  schedule:
    # 13F deadlines fall around 15 Feb, 15 May, 15 Aug, 15 Nov. Run on the 16th and 22nd of those months.
    - cron: "0 6 16,22 2,5,8,11 *"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python3 -m unittest discover -s apps/protege/tests
      - name: Fetch 13F filings from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          test -n "$SEC_USER_AGENT" || { echo "Set the repository variable SEC_USER_AGENT (your name and email)"; exit 1; }
          python3 apps/protege/scripts/fetch_13f.py --ua "$SEC_USER_AGENT"
      - name: Build feeds
        run: python3 apps/protege/scripts/feeds.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/protege/data apps/protege/feeds
          git diff --cached --quiet || git commit -m "Refresh 13F data"
          git pull --rebase origin main
          git push

  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
